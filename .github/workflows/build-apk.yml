name: Compilar JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto
        run: |
          unzip -o JARVIS_sin_Android_Studio.zip -d proyecto
          find proyecto -maxdepth 3 -type f | head -50

      - name: Compilar APK
        working-directory: proyecto/JARVIS_Android_Studio
        run: gradle assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: proyecto/JARVIS_Android_Studio/app/build/outputs/apk/debug/app-debug.apk
